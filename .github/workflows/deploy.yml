# Builds the static site and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment mid-way; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Checks that Pages is enabled with "GitHub Actions" as the source.
      - uses: actions/configure-pages@v6

      - run: npm ci

      # Validates content (fails on errors), optimises images, then exports to out/.
      # The site is served from the root of its custom domain (journeyboom.com), so no base
      # path is set and canonical URLs/sitemap use content/settings/site.json → siteUrl.
      # To serve from https://<user>.github.io/<repo>/ instead, add:
      #   NEXT_PUBLIC_BASE_PATH: /<repo>
      #   SITE_URL: https://<user>.github.io/<repo>
      - run: npm run build
        env:
          # Optional: set under Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_MAILCHIMP_FORM_URL: ${{ vars.MAILCHIMP_FORM_URL }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
